<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadis — constellation scolaire</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="./">jadis<span aria-hidden="true">✳&#xfe0e;</span></a><span class="tag">RECONNECTING PEOPLE · DÉMO</span><a href="beta.html">Bêta privée</a><button id="reset">Ma constellation</button></header><main><aside class="left"><small>01 / EXPLORER</small><h1>Nos années ensemble.</h1><label for="search">Trouver un établissement</label><input id="search" placeholder="Nom, ville ou code postal"><div id="schools"></div><label>Référentiel<select id="directory-category"><option value="all">Tous les établissements</option><option value="school">Écoles, collèges, lycées</option><option value="higher">Universités et supérieur</option><option value="closed">Établissements fermés</option></select></label><button id="official-search" type="button">Chercher dans l’annuaire national</button><div id="directory-status" aria-live="polite"></div><div id="directory-results"></div><form id="add"><label>Ajouter à mon parcours<select name="school"></select></label><label>Première année<input type="number" name="start" min="1900" max="2026" value="2001" required></label><label>Dernière année<input type="number" name="end" min="1900" max="2026" value="2006" required></label><button>Ajouter au parcours</button></form></aside><section class="atlas"><div class="toolbar"><span>● CONSTELLATION SCOLAIRE</span><label>Année <select id="year"><option value="">Toutes</option></select></label></div><svg id="graph" viewBox="0 0 800 650" role="group" aria-label="Carte interactive des établissements, classes et personnes fictives"></svg><div class="legend"><span>● Établissement</span><span>◆ Année scolaire</span><span>● Classe</span><span>○ Ancien élève</span></div></section><aside class="right" aria-live="polite" id="detail"></aside></main><footer>Prototype int
